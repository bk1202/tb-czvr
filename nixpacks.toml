[phases.setup]
aptPkgs = ["libpq-dev", "libzip-dev", "libpng-dev", "libjpeg-dev", "libwebp-dev", "libicu-dev", "libsodium-dev", "libxml2-dev", "unzip"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs"]

[start]
cmd = "php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
